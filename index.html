    function updateEditMenuState() {
      var hasSel = edit.selectionStart !== edit.selectionEnd;
      document.querySelectorAll('[data-action="cut"], [data-action="copy"], [data-action="delete"]').forEach(function(el) {
        el.disabled = !hasSel;
      });
      var hasClip = false;
      try { hasClip = !!(localStorage.getItem(CLIP_KEY) || '').length; } catch(e) {}
      document.querySelectorAll('[data-action="paste"]').forEach(function(el) {
        el.disabled = !hasClip && !(navigator.clipboard && navigator.clipboard.readText);
      });
      document.querySelectorAll('[data-action="toggleWrap"]').forEach(function(el) {
        el.classList.toggle('checked', settings.wordWrap);
      });
    }

    document.querySelectorAll('.menu-trigger').forEach(function(trigger) {
      trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        var menuId = trigger.dataset.menu;
        if (!menuId) return;
        if (state.openMenu === menuId) closeAllMenus();
        else openMenu(menuId, trigger);
      });
      trigger.addEventListener('mouseenter', function() {
        if (!trigger.dataset.menu) return;
        if (state.openMenu) openMenu(trigger.dataset.menu, trigger);
      });
    });

    document.getElementById('historyMenuBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      closeAllMenus();
      openHistoryDialog();
    });

    document.getElementById('settingsMenuBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      closeAllMenus();
      openSettingsDialog();
    });

    // Tab switcher trigger (browser-like 1-10 pages)
    (function setupTabButton() {
      var btn = document.getElementById('tabMenuBtn');
      if (!btn) return;
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var sw = document.getElementById('tabSwitcher');
        if (sw && sw.classList.contains('show')) {
          closeTabSwitcher();
        } else {
          openTabSwitcher();
        }
      });
    })();

    var resizeStatsTimer = null;
    function debouncedStatsUpdate() {
      clearTimeout(resizeStatsTimer);
      resizeStatsTimer = setTimeout(scheduleStatsUpdate, 120);
    }

    var resizeRaf = null;
    window.addEventListener('resize', function() {
      debouncedStatsUpdate();
      if (resizeRaf) return;
      resizeRaf = requestAnimationFrame(function() {
        resizeRaf = null;
        repositionPopups();
      });
    });

    function repositionPopups() {
      if (!state.openMenu) {
        // still reposition tab switcher if visible
        var sw = document.getElementById('tabSwitcher');
        if (sw && sw.classList.contains('show')) {
          var t = document.getElementById('tabMenuBtn');
          if (t) positionTabSwitcher(t);
        }
        return;
      }
      var trigger = document.querySelector('.menu-trigger.open');
      var menu = document.getElementById(state.openMenu);
      if (trigger && menu) positionMenu(menu, trigger);
    }

    if (window.ResizeObserver) {
      var statsResizeObs = new ResizeObserver(function() {
        debouncedStatsUpdate();
      });
      statsResizeObs.observe(edit);
      statsResizeObs.observe(edit.parentElement);
    }

    document.addEventListener('click', function(e) {
      if (e.target.closest('#menuBar') || e.target.closest('.menu-dropdown') || e.target.closest('#tabSwitcher')) return;
      closeAllMenus();
      hideContextMenu();
      closeTabSwitcher();
    });
    document.getElementById('menuBar').addEventListener('click', function(e) { e.stopPropagation(); });

    function showOverlay() {
      overlay.classList.add('show');
      updatePopupState();
    }
    function hideOverlay() {
      overlay.classList.remove('show');
      var historyDialog = document.getElementById('historyDialog');
      if (historyDialog && historyDialog.classList.contains('show')) {
        var titleEl = historyDialog.querySelector('.win-dialog-title');
        if (titleEl) titleEl.textContent = 'Auto-save History';
      }
      document.querySelectorAll('.win-dialog').forEach(function(d) {
        d.classList.remove('show', 'resize-anim');
        d.style.height = '';
        d.style.width = '';
        d.style.transition = '';
        d._rzTok = (d._rzTok || 0) + 1;
      });
      updatePopupState();
    }
    function showDialog(id) {
      perfProbe();
      document.querySelectorAll('.win-dialog').forEach(function(d) {
        if (d.id !== id) {
          d.classList.remove('show', 'resize-anim');
          d.style.height = '';
          d.style.width = '';
          d.style.transition = '';
          d._rzTok = (d._rzTok || 0) + 1;
        }
      });
      showOverlay();
      document.getElementById(id).classList.add('show');
      updatePopupState();
    }

    // ダイアログのサイズ変化を「横縦とも同じ平均速度(px/ms)・加減速(ease-in-out)」でアニメーションさせる。
    // 縮む場合も正しく動くよう、auto にして本来のサイズを測る(scrollHeight は縮み先を返せない)。
    var DIALOG_RESIZE_SPEED = 0.6; // px/ms(横も縦も同じ平均速度)
    var DIALOG_RESIZE_EASE = 'cubic-bezier(0.4, 0, 0.2, 1)'; // 加減速(ease-in-out)

    function animateDialogContent(dialog, mutateFn, opts) {
      opts = opts || {};
      if (!dialog || !dialog.classList.contains('show')) {
        if (mutateFn) mutateFn();
        return;
      }
      var body = dialog.querySelector('.win-dialog-body');
      var list = dialog.querySelector('.history-list');
      var fade = opts.fade !== false;
      var tok = (dialog._rzTok = (dialog._rzTok || 0) + 1);

      // 1) 現在のサイズで固定(アニメ途中での再実行でも現在値から続ける)
      var r0 = dialog.getBoundingClientRect();
      var startW = r0.width, startH = r0.height;
      dialog.style.transition = 'none';
      dialog.classList.add('resize-anim');
      dialog.style.width = startW + 'px';
      dialog.style.height = startH + 'px';
      void dialog.offsetHeight;

      if (fade && body) body.classList.add('resize-anim-body', 'resize-fade');
      if (fade && list) list.classList.add('fading');

      // 2) 中身を更新し、新しい本来のサイズを測る
      if (mutateFn) mutateFn();
      dialog.style.width = '';
      dialog.style.height = 'auto';
      var r1 = dialog.getBoundingClientRect();
      var endW = r1.width, endH = r1.height;
      dialog.style.width = startW + 'px';
      dialog.style.height = startH + 'px';
      void dialog.offsetHeight;

      function cleanup() {
        if (dialog._rzTok !== tok) return;
        dialog.style.height = '';
        dialog.style.width = '';
        dialog.style.transition = '';
        dialog.classList.remove('resize-anim');
        if (body) body.classList.remove('resize-anim-body', 'resize-fade');
        if (list) list.classList.remove('fading');
        dialog.removeEventListener('transitionend', onEnd);
      }
      var pending = 0;
      function onEnd(e) {
        if (e.target !== dialog) return;
        if (e.propertyName !== 'height' && e.propertyName !== 'width') return;
        if (--pending <= 0) cleanup();
      }

      var dW = Math.abs(endW - startW);
      var dH = Math.abs(endH - startH);
      if (dW < 1 && dH < 1) {
        cleanup();
        return;
      }

      // 3) 横・縦とも同じ平均速度(px/ms)で加減速(ease-in-out)。長い方の所要時間を 140〜360ms に収め、
      //    その速度を両軸に共通で使う(短い方は先に着くだけで、速度は常に等しい)
      var longest = Math.max(140, Math.min(360, Math.round(Math.max(dW, dH) / DIALOG_RESIZE_SPEED)));
      var speed = Math.max(dW, dH) / longest; // px/ms(両軸共通)
      var durW = dW >= 1 ? Math.max(1, Math.round(dW / speed)) : 0;
      var durH = dH >= 1 ? Math.max(1, Math.round(dH / speed)) : 0;

      var tr = 'opacity 0.28s ease, ' +
               'transform 0.32s cubic-bezier(0.34, 1.3, 0.64, 1), ' +
               'visibility 0.28s ease';
      if (dW >= 1) { tr += ', width ' + durW + 'ms ' + DIALOG_RESIZE_EASE; pending++; }
      if (dH >= 1) { tr += ', height ' + durH + 'ms ' + DIALOG_RESIZE_EASE; pending++; }
      dialog.style.transition = tr;
      dialog.addEventListener('transitionend', onEnd);
      dialog.style.width = endW + 'px';
      dialog.style.height = endH + 'px';
      if (body) body.classList.remove('resize-fade');
      if (list) list.classList.remove('fading');
      setTimeout(cleanup, Math.max(durW, durH) + 120);
    }

    function doNew() {
      if (!edit.value.trim()) {
        edit.value = '';
        state.fileName = '無題';
        updateTitle(); updateStats(); saveToStorage();
        return;
      }
      state.dialogType = 'new';
      document.getElementById('confirmMsg').textContent = '内容をすべて消去しますか？';
      showDialog('confirmDialog');
    }

    function doSave() {
      var defaultName = state.fileName === '無題' ? '無題.txt' :
        (/\.(txt|md|csv|log)$/i.test(state.fileName) ? state.fileName : state.fileName + '.txt');
      document.getElementById('saveFileName').value = defaultName;
      showDialog('saveDialog');
      document.getElementById('saveFileName').focus();
      document.getElementById('saveFileName').select();
    }

    function initHistories() {
      // Migrate legacy single global history into tab 0 if no per-tab histories exist yet
      try {
        var oldRaw = localStorage.getItem(HISTORY_KEY);
        var hasNew = localStorage.getItem(HISTORIES_KEY);
        if (oldRaw && !hasNew) {
          var oldArr = JSON.parse(oldRaw) || [];
          if (oldArr.length) {
            var all = {};
            all["0"] = oldArr;
            localStorage.setItem(HISTORIES_KEY, JSON.stringify(all));
          }
        }
      } catch (e) {}
    }

    function loadHistory(tabIdx) {
      if (typeof tabIdx !== 'number') tabIdx = activeTab;
      try {
        var all = JSON.parse(localStorage.getItem(HISTORIES_KEY)) || {};
        return all[String(tabIdx)] || [];
      } catch (e) { return []; }
    }

    function saveHistory(arr, tabIdx) {
      if (typeof tabIdx !== 'number') tabIdx = activeTab;
      try {
        var all = JSON.parse(localStorage.getItem(HISTORIES_KEY)) || {};
        all[String(tabIdx)] = arr;
        localStorage.setItem(HISTORIES_KEY, JSON.stringify(all));
      } catch (e) {}
    }

    function pushHistoryEntry() {
      var content = edit.value || '';
      if (!content.trim()) return; // do not save empty / whitespace-only snapshots to history
      var history = loadHistory(activeTab);
      if (history.length && history[0].content === content) return;
      history.unshift({
        id: Date.now(),
        content: content,
        fileName: state.fileName,
        savedAt: Date.now()
      });
      if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
      saveHistory(history, activeTab);
    }

    function forceSave() {
      // Manually trigger what the auto-save timer does: persist + add snapshot to this tab's history
      saveToStorage();
      pushHistoryEntry();
      showToast('強制保存しました');

      // If the tab switcher is currently visible, refresh the dots immediately
      var sw = document.getElementById('tabSwitcher');
      if (sw && sw.classList.contains('show')) {
        renderTabSlots();
      }
    }

    function saveToStorage() {
      // now per-tab
      saveCurrentTab();
    }

    function formatHistoryTime(ts) {
      var d = new Date(ts);
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function renderHistoryList(animate) {
      var dialog = document.getElementById('historyDialog');
      var doRender = function() {
        var list = document.getElementById('historyList');
        var history = loadHistory(activeTab);
        list.innerHTML = '';
        if (!history.length) {
          list.innerHTML = '<div class="history-empty">履歴がありません</div>';
          return;
        }
        history.forEach(function(entry, i) {
          var btn = document.createElement('button');
          btn.className = 'history-item';
          btn.style.animationDelay = (i * 0.045) + 's';
          var preview = entry.content.slice(0, 48).replace(/\n/g, ' ') || '(空)';
          if (entry.content.length > 48) preview += '…';
          btn.innerHTML = '<span class="history-time">' + formatHistoryTime(entry.savedAt) + '</span>' +
            '<span class="history-preview"></span>';
          btn.querySelector('.history-preview').textContent = preview;
          btn.addEventListener('click', function() {
            edit.value = entry.content;
            state.fileName = entry.fileName || '無題';
            updateTitle();
            updateStats();
            saveToStorage();
            hideOverlay();
            showToast('履歴を復元しました');
          });
          list.appendChild(btn);
        });
      };
      if (animate && dialog.classList.contains('show')) {
        animateDialogContent(dialog, doRender);
      } else {
        doRender();
      }
    }

    function openHistoryDialog() {
      // Update title to indicate which tab's history we are looking at
      var titleEl = document.querySelector('#historyDialog .win-dialog-title');
      if (titleEl) {
        titleEl.textContent = 'Auto-save History (Tab ' + (activeTab + 1) + ')';
      }
      renderHistoryList(false);
      showDialog('historyDialog');
    }

    function clearHistory() {
      var all = {};
      try { all = JSON.parse(localStorage.getItem(HISTORIES_KEY)) || {}; } catch (e) {}
      delete all[String(activeTab)];
      try { localStorage.setItem(HISTORIES_KEY, JSON.stringify(all)); } catch (e) {}
      // also clean legacy key if present
      try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
      renderHistoryList(true);
      showToast('タブ ' + (activeTab + 1) + ' の履歴を消去しました');
    }

    /* ===== Tabs (1-10 page switcher) ===== */
    function saveTabs() {
      try { localStorage.setItem(TABS_KEY, JSON.stringify(tabs)); } catch(e) {}
    }
    function saveActiveTab() {
      try { localStorage.setItem(ACTIVE_KEY, String(activeTab)); } catch(e) {}
    }

    function initTabs() {
      var migrated = false;
      try {
        var saved = JSON.parse(localStorage.getItem(TABS_KEY));
        if (Array.isArray(saved) && saved.length === NUM_TABS) {
          tabs = saved.map(function(t) {
            return { content: t.content || '', fileName: t.fileName || '無題', savedAt: t.savedAt || Date.now() };
          });
        } else {
          tabs = [];
          for (var i = 0; i < NUM_TABS; i++) {
            tabs.push({ content: '', fileName: '無題', savedAt: Date.now() });
          }
          // migrate legacy single document into tab 0
          try {
            var oldRaw = localStorage.getItem(STORAGE_KEY);
            if (oldRaw) {
              var od = JSON.parse(oldRaw);
              if (od && od.content !== undefined) {
                tabs[0].content = od.content || '';
                tabs[0].fileName = od.fileName || '無題';
                migrated = true;
                migratedLegacy = true;
              }
            }
          } catch (e) {}
          saveTabs();
        }
      } catch (e) {
        tabs = [];
        for (var j = 0; j < NUM_TABS; j++) {
          tabs.push({ content: '', fileName: '無題', savedAt: Date.now() });
        }
        saveTabs();
      }
      try {
        var act = parseInt(localStorage.getItem(ACTIVE_KEY), 10);
        if (!isNaN(act) && act >= 0 && act < NUM_TABS) activeTab = act;
      } catch (e) {}
      if (migrated) {
        saveActiveTab();
      }
    }

    function saveCurrentTab() {
      if (!tabs[activeTab]) return;
      tabs[activeTab].content = edit.value || '';
      tabs[activeTab].fileName = state.fileName || '無題';
      tabs[activeTab].savedAt = Date.now();
      saveTabs();
    }

    function loadTab(idx) {
      var t = tabs[idx];
      if (!t) return;
      edit.value = t.content || '';
      state.fileName = t.fileName || '無題';
      updateTitle();
      updateStats();
    }

    function switchToTab(idx) {
      if (idx < 0 || idx >= NUM_TABS || idx === activeTab) {
        closeTabSwitcher();
        return;
      }
      saveCurrentTab();
      activeTab = idx;
      saveActiveTab();
      loadTab(activeTab);
      updateCurrentTabUI();
      closeTabSwitcher();
      showToast('タブ ' + (activeTab + 1) + ' に切り替えました');
      setTimeout(function () { try { edit.focus(); } catch (e) {} }, 30);
    }

    function updateCurrentTabUI() {
      var numEl = document.getElementById('currentTabNum');
      if (numEl) numEl.textContent = String(activeTab + 1);
    }

    function renderTabSlots() {
      var bar = document.getElementById('tabBar');
      if (!bar) return;
      bar.innerHTML = '';
      for (var i = 0; i < NUM_TABS; i++) {
        var slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'tab-slot';
        slot.dataset.tab = String(i);
        slot.textContent = String(i + 1);
        if (i === activeTab) slot.classList.add('active');
        var tabData = tabs[i];
        var hasContent = !!(tabData && typeof tabData.content === 'string' && tabData.content.trim().length > 0);
        if (hasContent) slot.classList.add('has-content');
        slot.addEventListener('click', function (ev) {
          var tIdx = parseInt(ev.currentTarget.dataset.tab, 10);
          switchToTab(tIdx);
        });
        bar.appendChild(slot);
      }
    }

    function positionTabSwitcher(trigger) {
      var switcher = document.getElementById('tabSwitcher');
      if (!switcher || !trigger) return;
      var rect = trigger.getBoundingClientRect();
      var approxW = Math.min(320, Math.max(280, window.innerWidth * 0.7));
      var left = Math.max(6, rect.left + rect.width / 2 - approxW / 2);
      if (left + approxW + 6 > window.innerWidth) left = Math.max(6, window.innerWidth - approxW - 6);
      switcher.style.left = left + 'px';
      switcher.style.top = (rect.bottom + 5) + 'px';
      // callout origin so it "pops" from near the button
      var originPct = ((rect.left + rect.width / 2) - left) / approxW * 100;
      switcher.style.transformOrigin = originPct.toFixed(1) + '% 0%';
    }

    function openTabSwitcher() {
      closeAllMenus();
      var switcher = document.getElementById('tabSwitcher');
      var trigger = document.getElementById('tabMenuBtn');
      if (!switcher || !trigger) return;

      // Flush latest editor content so the "has content" dots are accurate
      saveCurrentTab();

      // Cancel any pending close that might hide it
      if (tabCloseTimer) {
        clearTimeout(tabCloseTimer);
        tabCloseTimer = null;
      }

      // Force visible + reset any inline styles left by previous close
      switcher.style.visibility = 'visible';
      switcher.style.transition = 'none';
      switcher.style.opacity = '0';
      switcher.style.transform = 'scale(0.86, 0.6) translateY(-6px)';
      switcher.classList.remove('show');

      positionTabSwitcher(trigger);
      renderTabSlots();

      // force layout then animate (the squash-to-full + staggered numbers)
      void switcher.offsetHeight;

      switcher.style.transition = 'opacity 0.22s cubic-bezier(0.22,1,0.36,1), transform 0.42s cubic-bezier(0.34,1.56,0.64,1)';
      switcher.style.opacity = '1';
      switcher.style.transform = 'scale(1) translateY(0)';
      switcher.classList.add('show');

      trigger.classList.add('open');
      updatePopupState();
    }

    function closeTabSwitcher() {
      var switcher = document.getElementById('tabSwitcher');
      var trigger = document.getElementById('tabMenuBtn');

      if (tabCloseTimer) {
        clearTimeout(tabCloseTimer);
        tabCloseTimer = null;
      }

      if (switcher) {
        switcher.classList.remove('show');
        switcher.style.transition = 'opacity 0.16s cubic-bezier(0.4,0,1,1), transform 0.18s cubic-bezier(0.4,0,1,1)';
        switcher.style.opacity = '0';
        switcher.style.transform = 'scale(0.55, 0.3) translateY(-6px)';

        tabCloseTimer = setTimeout(function () {
          tabCloseTimer = null;
          if (switcher && !switcher.classList.contains('show')) {
            switcher.style.visibility = 'hidden';
            // clean up so next open starts fresh
            switcher.style.transition = '';
            switcher.style.opacity = '';
            switcher.style.transform = '';
          }
        }, 200);
      }
      if (trigger) trigger.classList.remove('open');
      updatePopupState();
    }

    function updatePopupState() {
      var switcher = document.getElementById('tabSwitcher');
      var tabOpen = !!(switcher && switcher.classList.contains('show'));
      var anyOpen = !!state.openMenu ||
        (contextMenu && contextMenu.classList.contains('show')) ||
        (overlay && overlay.classList.contains('show')) ||
        tabOpen;
      document.body.classList.toggle('popup-open', anyOpen);
    }

    function restoreFromStorage() {
      initTabs();
      initHistories();
      loadTab(activeTab);
      updateCurrentTabUI();
      if (migratedLegacy) {
        showToast('前回の内容をタブ1に復元しました', 2200);
        migratedLegacy = false;
      }
    }

    function setupAutoSave() {
      clearInterval(state.autoSaveTimer);
      if (!settings.autoSave) return;
      state.autoSaveTimer = setInterval(function() {
        saveToStorage();
        pushHistoryEntry();
      }, parseInt(settings.autoSaveInterval, 10) * 1000);
    }

    function downloadFile(name) {
      var blob = new Blob([edit.value], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      URL.revokeObjectURL(url);
    }

    function doCopy() {
      var s = edit.selectionStart, e = edit.selectionEnd;
      var text = edit.value.slice(s, e);
      if (!text) return;
      localStorage.setItem(CLIP_KEY, text);
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function() {});
    }

    function doCut() {
      var s = edit.selectionStart, e = edit.selectionEnd;
      var text = edit.value.slice(s, e);
      if (!text) return;
      localStorage.setItem(CLIP_KEY, text);
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function() {});
      edit.setRangeText('', s, e, 'start');
      updateStats(); saveToStorage();
    }

    function doPaste() {
      function insert(text) {
        var s = edit.selectionStart, e = edit.selectionEnd;
        edit.setRangeText(text, s, e, 'end');
        updateStats(); saveToStorage();
      }
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText()
          .then(function(t) { insert(t || localStorage.getItem(CLIP_KEY) || ''); })
          .catch(function() { insert(localStorage.getItem(CLIP_KEY) || ''); });
      } else {
        insert(localStorage.getItem(CLIP_KEY) || '');
      }
    }

    function doDelete() {
      var s = edit.selectionStart, e = edit.selectionEnd;
      if (s === e) return;
      edit.setRangeText('', s, e, 'start');
      updateStats(); saveToStorage();
    }

    function hideContextMenu() {
      contextMenu.classList.remove('show');
      updatePopupState();
    }

    function showContextMenu(x, y) {
      updateEditMenuState();
      var menuW = 170, menuH = 140;
      contextMenu.style.left = Math.max(4, Math.min(x, window.innerWidth - menuW - 4)) + 'px';
      contextMenu.style.top = Math.max(4, Math.min(y, window.innerHeight - menuH - 4)) + 'px';
      contextMenu.classList.add('show');
      updatePopupState();
    }

    function handleAction(action) {
      closeAllMenus();
      switch(action) {
        case 'new': doNew(); break;
        case 'open': document.getElementById('fileInput').click(); break;
        case 'save': doSave(); break;
        case 'history': openHistoryDialog(); break;
        case 'cut': doCut(); break;
        case 'copy': doCopy(); break;
        case 'paste': doPaste(); break;
        case 'delete': doDelete(); break;
        case 'font': openSettingsDialog('font'); break;
        case 'toggleWrap':
          settings.wordWrap = !settings.wordWrap;
          saveSettings(settings);
          applySettings();
          showToast('自動改行 ' + (settings.wordWrap ? 'ON' : 'OFF'));
          break;
        case 'selectAll': edit.select(); updateStats(); break;
        case 'settings': openSettingsDialog(); break;
        case 'find': openSearchBar(); break;
      }
    }

    document.querySelectorAll('.menu-dropdown').forEach(function(menu) {
      menu.addEventListener('click', function(e) {
        var item = e.target.closest('.menu-item[data-action]');
        if (!item) return;
        e.stopPropagation();
        if (item.disabled) return;
        handleAction(item.dataset.action);
      });
    });
    // Prevent underlying textarea caret/focus when clicking inside menus
    document.querySelectorAll('.menu-dropdown').forEach(function(menu) {
      menu.addEventListener('mousedown', function(e) {
        var item = e.target.closest('.menu-item[data-action]');
        if (item) e.preventDefault();
      });
    });

    contextMenu.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-action]');
      if (!btn || btn.disabled) return;
      e.stopPropagation();
      handleAction(btn.dataset.action);
      hideContextMenu();
    });

    document.getElementById('confirmOk').addEventListener('click', function() {
      if (state.dialogType === 'new') {
        edit.value = ''; state.fileName = '無題';
        updateTitle(); updateStats(); saveToStorage();
      } else if (state.dialogType === 'clear') {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(HISTORY_KEY);
        localStorage.removeItem(HISTORIES_KEY);
        localStorage.removeItem(TABS_KEY);
        localStorage.removeItem(ACTIVE_KEY);
        // reset in-memory tabs to fresh empty set

    /* ===== Search (Ctrl+F) ===== */
    var searchState = { matches: [], current: -1, caseSensitive: false };

    function openSearchBar() {
      var bar = document.getElementById('searchBar');
      var inp = document.getElementById('searchInput');
      bar.classList.add('show');
      inp.focus();
      inp.select();
      runSearch();
    }

    function closeSearchBar() {
      var bar = document.getElementById('searchBar');
      bar.classList.remove('show');
      searchState.matches = [];
      searchState.current = -1;
      document.getElementById('searchCount').textContent = '';
      document.getElementById('searchInput').classList.remove('no-match');
      edit.focus();
    }

    function runSearch() {
      var query = document.getElementById('searchInput').value;
      var countEl = document.getElementById('searchCount');
      searchState.matches = [];
      searchState.current = -1;

      document.getElementById('searchInput').classList.remove('no-match');

      if (!query) {
        countEl.textContent = '';
        return;
      }

      var text = edit.value;
      var flags = searchState.caseSensitive ? 'g' : 'gi';
      var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re;
      try { re = new RegExp(escaped, flags); } catch(e) { return; }

      var m;
      while ((m = re.exec(text)) !== null) {
        searchState.matches.push({ start: m.index, end: m.index + m[0].length });
        if (re.lastIndex === m.index) re.lastIndex++; // avoid infinite loop on empty match
      }

      if (!searchState.matches.length) {
        document.getElementById('searchInput').classList.add('no-match');
        countEl.textContent = '見つかりません';
        return;
      }

      // Jump to nearest match from caret
      var caret = edit.selectionStart;
      var best = 0;
      for (var i = 0; i < searchState.matches.length; i++) {
        if (searchState.matches[i].start >= caret) { best = i; break; }
        best = i;
      }
      searchState.current = best;
      jumpToMatch(searchState.current);
    }

    function jumpToMatch(idx) {
      var matches = searchState.matches;
      if (!matches.length || idx < 0 || idx >= matches.length) return;
      var m = matches[idx];
      edit.focus();
      edit.setSelectionRange(m.start, m.end);

      // Scroll match into view in the textarea
      var linesBefore = edit.value.substring(0, m.start).split('\n').length - 1;
      var lineH = parseFloat(getComputedStyle(edit).lineHeight) || 24;
      var scrollTarget = lineH * linesBefore - edit.clientHeight / 2;
      edit.scrollTop = Math.max(0, scrollTarget);

      // Update count label
      document.getElementById('searchCount').textContent =
        (idx + 1) + ' / ' + matches.length;
    }

    function searchNext() {
      if (!searchState.matches.length) { runSearch(); return; }
      searchState.current = (searchState.current + 1) % searchState.matches.length;
      jumpToMatch(searchState.current);
    }

    function searchPrev() {
      if (!searchState.matches.length) { runSearch(); return; }
      searchState.current = (searchState.current - 1 + searchState.matches.length) % searchState.matches.length;
      jumpToMatch(searchState.current);
    }

    // Wire up search bar UI
    document.getElementById('searchInput').addEventListener('input', runSearch);

    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (e.shiftKey) searchPrev(); else searchNext();
      }
      if (e.key === 'Escape') { e.preventDefault(); closeSearchBar(); }
      if (e.altKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        document.getElementById('searchCaseBtn').click();
      }
    });

    document.getElementById('searchNext').addEventListener('click', searchNext);
    document.getElementById('searchPrev').addEventListener('click', searchPrev);

    document.getElementById('searchCaseBtn').addEventListener('click', function() {
      searchState.caseSensitive = !searchState.caseSensitive;

      this.setAttribute('aria-pressed', String(searchState.caseSensitive));

    });

    document.getElementById('searchClose').addEventListener('click', closeSearchBar);

    // Re-run search when editor content changes (invalidates matches)
    edit.addEventListener('input', function() {
      var bar = document.getElementById('searchBar');

        runSearch();
      }
    });

    document.addEventListener('keydown', function(e) {
      var ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && e.key === 's') { e.preventDefault(); doSave(); return; }
      if (ctrl && e.key === 'n') { e.preventDefault(); doNew(); return; }
      if (ctrl && e.key === 'o') { e.preventDefault(); document.getElementById('fileInput').click(); return; }
      if (ctrl && e.key === 'a') { e.preventDefault(); edit.select(); updateStats(); return; }
      if (ctrl && e.key === 'ArrowUp') { e.preventDefault(); zoomIn(); return; }
      if (ctrl && e.key === 'ArrowDown') { e.preventDefault(); zoomOut(); return; }

      if (ctrl && e.key === 'f') { e.preventDefault(); openSearchBar(); return; }

      // Ctrl+1 : force save (persist current tab + add snapshot to its history immediately)
      if (ctrl && e.key === '1') {
        e.preventDefault();
        forceSave();
        return;
      }

      // browser-like tab switch: Ctrl+Shift+1..9 / Ctrl+Shift+0 (for tab 10)
      if (ctrl && e.shiftKey && !e.altKey) {
        var digit = null;
        if (e.key >= '1' && e.key <= '9') digit = parseInt(e.key, 10) - 1;
        else if (e.key === '0') digit = 9;
        if (digit !== null && digit >= 0 && digit < NUM_TABS) {
          e.preventDefault();
          switchToTab(digit);
          return;
        }
      }

      if (e.altKey) {
        var key = e.key.toLowerCase();
        if (key === 'f') { e.preventDefault(); openMenu('fileMenu', document.querySelector('[data-menu="fileMenu"]')); }
        if (key === 'e') { e.preventDefault(); openMenu('editMenu', document.querySelector('[data-menu="editMenu"]')); }
        if (key === 's') { e.preventDefault(); openSettingsDialog(); }
        if (key === 'h') { e.preventDefault(); openHistoryDialog(); }
      }
      if (e.key === 'Escape') {
        var searchBar = document.getElementById('searchBar');
        if (searchBar && searchBar.classList.contains('show')) { closeSearchBar(); return; }
        closeAllMenus(); closeTabSwitcher(); hideOverlay(); hideContextMenu();
      }
    });

    /* ===== 独自スクロールバー(エディタ) =====
       ・標準バーは隠し、細いバーを重ねる(横幅を食わないので文章が再折返しされない)
       ・バーが出現/消滅するとき、全文が上から1行ずつ(加減速で)少し左へ寄る/戻る */
    var SB_SHIFT = 6;           // 文章が寄る距離(px)
    var SB_DUR_MS = 320;        // 1行の移動時間
    var sbInit = false, sbRaf = null, sbWave = null;

    function makeSb(axis) {
      var el = document.createElement('div');
      el.className = 'sb sb-' + axis;
      el.setAttribute('aria-hidden', 'true');
      var th = document.createElement('div');
      th.className = 'sb-thumb';
      el.appendChild(th);
      edit.parentElement.appendChild(el);
      var isV = axis === 'v';
      th.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        el.classList.add('drag');
        th.setPointerCapture(e.pointerId);
        var p0 = isV ? e.clientY : e.clientX;
        var s0 = isV ? edit.scrollTop : edit.scrollLeft;
        function mv(ev) {
          var track = isV ? el.clientHeight : el.clientWidth;
          var tsz = isV ? th.offsetHeight : th.offsetWidth;
          var range = track - tsz;
          if (range <= 0) return;
          var d = (isV ? ev.clientY : ev.clientX) - p0;
          var total = isV ? edit.scrollHeight - edit.clientHeight : edit.scrollWidth - edit.clientWidth;
          if (isV) edit.scrollTop = s0 + d * total / range; else edit.scrollLeft = s0 + d * total / range;
        }
        function up() {
          th.removeEventListener('pointermove', mv);
          th.removeEventListener('pointerup', up);
          th.removeEventListener('pointercancel', up);
          el.classList.remove('drag');
        }
        th.addEventListener('pointermove', mv);
        th.addEventListener('pointerup', up);
        th.addEventListener('pointercancel', up);
      });
      el.addEventListener('pointerdown', function(e) {
        if (e.target !== el) return;   // トラックのクリック → ページ送り
        var r = th.getBoundingClientRect();
        var dir = isV ? (e.clientY < r.top ? -1 : 1) : (e.clientX < r.left ? -1 : 1);
        if (isV) edit.scrollBy({ top: dir * edit.clientHeight * 0.9, behavior: 'smooth' });
        else edit.scrollBy({ left: dir * edit.clientWidth * 0.9, behavior: 'smooth' });
      });
      return { el: el, th: th, vis: false };
    }
    var sbV = makeSb('v'), sbH = makeSb('h');

    function scheduleSb() {
      if (sbRaf) return;
      sbRaf = requestAnimationFrame(updateSb);
    }

    function updateSb() {
      sbRaf = null;
      var ch = edit.clientHeight, sh = edit.scrollHeight, cw = edit.clientWidth, sw = edit.scrollWidth;
      var needV = sh > ch + 1, needH = sw > cw + 1;
      sbV.el.style.bottom = needH ? '16px' : '4px';
      sbH.el.style.right = needV ? '16px' : '4px';
      if (needV) {
        var trackH = sbV.el.clientHeight || (ch - 8);
        var thH = Math.max(28, trackH * ch / sh);
        var maxT = sh - ch;
        var topV = maxT > 0 ? edit.scrollTop / maxT * (trackH - thH) : 0;
        sbV.th.style.height = thH + 'px';
        sbV.th.style.transform = 'translateY(' + topV + 'px)';
      }
      if (needH) {
        var trackW = sbH.el.clientWidth || (cw - 8);
        var thW = Math.max(28, trackW * cw / sw);
        var maxL = sw - cw;
        var leftH = maxL > 0 ? edit.scrollLeft / maxL * (trackW - thW) : 0;
        sbH.th.style.width = thW + 'px';
        sbH.th.style.transform = 'translateX(' + leftH + 'px)';
      }
      if (needH !== sbH.vis) { sbH.vis = needH; sbH.el.classList.toggle('on', needH); }
      if (needV !== sbV.vis) {
        sbV.vis = needV;
        sbV.el.classList.toggle('on', needV);
        shiftDoc(needV);
      }
      sbInit = true;
    }

    var docShiftPx = 0;
    function setDocShift(px) {
      docShiftPx = px || 0;
      edit.style.transform = px ? 'translateX(' + px + 'px)' : '';
    }

    function cancelWave() {
      if (!sbWave) return;
      clearTimeout(sbWave.timer);
      if (sbWave.clone.parentNode) sbWave.clone.parentNode.removeChild(sbWave.clone);
      edit.classList.remove('sb-anim');
      setDocShift(sbWave.to);
      sbWave = null;
    }

    // 全文を「上の行から順に」移動させる。textarea は行ごとに動かせないため、
    // アニメーション中だけ同じ見た目の複製(行ごとの div)を重ね、終わったら本物へ戻す。
    function shiftDoc(show) {
      cancelWave();
      var from = show ? 0 : -SB_SHIFT;
      var to = show ? -SB_SHIFT : 0;
      var lines = edit.value.split('\n');
      var heavy = lines.length > 1500 || edit.value.length > 150000;
      if (!sbInit || heavy || document.body.classList.contains('lite') || !edit.clientHeight) {
        setDocShift(to);
        return;
      }
      var cs = getComputedStyle(edit);
      var ch = edit.clientHeight;
      var wrap = edit.parentElement;
      var clone = document.createElement('div');
      clone.className = 'doc-clone';
      clone.style.width = edit.clientWidth + 'px';
      clone.style.height = ch + 'px';
      clone.style.left = edit.offsetLeft + 'px';
      clone.style.top = edit.offsetTop + 'px';
      ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'lineHeight', 'letterSpacing',
       'tabSize', 'color', 'textAlign'].forEach(function(k) { clone.style[k] = cs[k]; });
      var inner = document.createElement('div');
      inner.className = 'dl-inner';
      ['paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'whiteSpace',
       'wordBreak', 'overflowWrap'].forEach(function(k) { inner.style[k] = cs[k]; });
      inner.style.width = (cs.whiteSpace === 'pre' ? edit.scrollWidth : edit.clientWidth) + 'px';
      inner.style.transform = 'translate(' + (-edit.scrollLeft) + 'px,' + (-edit.scrollTop) + 'px)';
      var els = [];
      var frag = document.createDocumentFragment();
      lines.forEach(function(t) {
        var d = document.createElement('div');
        d.textContent = t === '' ? '\u200b' : t;
        d.style.transform = 'translateX(' + from + 'px)';
        frag.appendChild(d);
        els.push(d);
      });
      inner.appendChild(frag);
      clone.appendChild(inner);
      wrap.appendChild(clone);
      edit.classList.add('sb-anim');
      setDocShift(from);                 // 本物は文字を透明にして位置だけ現在値に
      void clone.offsetWidth;

      var st = edit.scrollTop;
      var lh = parseFloat(cs.lineHeight) || 24;

      // 折り返された段落は「見た目の1行ずつ」の div に分割する(画面内のものだけ)
      function splitWrapped(d) {
        var t = d.firstChild;
        if (!t || t.nodeType !== 3 || d.offsetHeight < lh * 1.5) return [d];
        var txt = t.nodeValue;
        if (txt.length > 3000) return [d];
        var r = document.createRange();
        var breaks = [0], prevTop = null;
        for (var i = 0; i < txt.length; i++) {
          r.setStart(t, i);
          r.setEnd(t, i + 1);
          var rc = r.getClientRects();
          if (!rc.length) continue;
          var top = rc[0].top;
          if (prevTop !== null && top > prevTop + lh * 0.5) breaks.push(i);
          prevTop = top;
        }
        if (breaks.length < 2) return [d];
        breaks.push(txt.length);
        var parts = [];
        for (var k = 0; k < breaks.length - 1; k++) {
          var p = document.createElement('div');
          p.style.whiteSpace = 'pre';
          p.textContent = txt.slice(breaks[k], breaks[k + 1]) || '\u200b';
          p.style.transform = 'translateX(' + from + 'px)';
          d.parentNode.insertBefore(p, d);
          parts.push(p);
        }
        d.parentNode.removeChild(d);
        return parts;
      }

      var tops = els.map(function(d) { return d.offsetTop; });
      var rows = [];
      els.forEach(function(d, i) {
        var vt = tops[i] - st;
        if (vt > ch || vt + d.offsetHeight < 0) { rows.push(d); return; }
        splitWrapped(d).forEach(function(x) { rows.push(x); });
      });
      void clone.offsetWidth;

      // 画面内の行を上から順に並べ、1行ずつ時間差をつけて加減速で左へ
      var vis = [];
      rows.forEach(function(d) {
        var vt = d.offsetTop - st;
        if (vt > ch || vt + d.offsetHeight < 0) d.style.transform = 'translateX(' + to + 'px)';
        else vis.push(d);
      });
      var step = Math.min(18, 450 / Math.max(1, vis.length));   // 1行あたりの遅れ(ms)
      vis.forEach(function(d, r) {
        d.style.transition = 'transform ' + SB_DUR_MS + 'ms ' + DIALOG_RESIZE_EASE + ' ' + Math.round(r * step) + 'ms';
        d.style.transform = 'translateX(' + to + 'px)';
      });
      sbWave = {
        clone: clone,
        to: to,
        timer: setTimeout(cancelWave, Math.round(vis.length * step) + SB_DUR_MS + 60)
      };
    }

    edit.addEventListener('scroll', function() { cancelWave(); scheduleSb(); }, { passive: true });
    edit.addEventListener('input', function() { cancelWave(); scheduleSb(); });
    if (window.ResizeObserver) new ResizeObserver(scheduleSb).observe(edit);
    new MutationObserver(scheduleSb).observe(edit, { attributes: true, attributeFilter: ['class', 'style'] });
    window.addEventListener('resize', scheduleSb);
    scheduleSb();

    /* ===== スムーズキャレット =====
       標準のキャレットは隠し、同じ位置に細い棒を重ねて、文字入力・改行・矢印移動のたびに
       前の位置から新しい位置へ加減速で滑らせる(軽量モード/超長文では標準キャレットに戻す) */
    var cc = document.createElement('div');
    cc.id = 'ccaret';
    cc.setAttribute('aria-hidden', 'true');
    edit.parentElement.appendChild(cc);
    var ccRaf = null, ccShown = false, ccLastX = null, ccLastY = null, ccLastShift = null, ccBlinkTimer = null;

    function scheduleCaret() {
      if (ccRaf) return;
      ccRaf = requestAnimationFrame(updateCaret);
    }

    function ccHide() {
      ccShown = false;
      clearTimeout(ccBlinkTimer);
      cc.classList.remove('show', 'blink');
    }

    function updateCaret() {
      ccRaf = null;
      var use = document.activeElement === edit &&
                !document.body.classList.contains('lite') &&
                edit.value.length < 200000;
      edit.classList.toggle('ccaret', use);
      if (!use || edit.selectionStart !== edit.selectionEnd) { ccHide(); return; }

      var cs = getComputedStyle(edit);
      var fs = parseFloat(cs.fontSize) || 16;
      var lh = parseFloat(cs.lineHeight) || fs * 1.65;
      var chh = Math.round(fs * 1.25);

      // 文字位置は不可視ミラーで測る(折返し・タブ・日本語も textarea と同じ)
      syncCaretMirror();
      var before = edit.value.slice(0, edit.selectionStart);
      caretMirror.innerHTML = escapeMirrorText(before) + '<span class="caret-m">\u200b</span>';
      var mk = caretMirror.querySelector('.caret-m');
      var dx = mk.offsetLeft, dy = mk.offsetTop;

      var vy = dy - edit.scrollTop;
      if (vy < -lh || vy > edit.clientHeight) { ccHide(); return; }   // 画面外

      var x = dx - edit.scrollLeft + edit.offsetLeft + docShiftPx;
      var y = vy + edit.offsetTop + (lh - chh) / 2;
      var tf = 'translate3d(' + x + 'px,' + y + 'px,0)';
      cc.style.height = chh + 'px';

      var moved = dx !== ccLastX || dy !== ccLastY || docShiftPx !== ccLastShift;
      if (!ccShown || !moved) {
        // 初表示・スクロールだけの変化は滑らせず即時
        cc.style.transition = 'none';
        cc.style.transform = tf;
        void cc.offsetWidth;
        cc.style.transition = '';
      } else {
        cc.style.transform = tf;    // 文字入力・改行・移動 → 加減速で滑る
      }
      ccLastX = dx; ccLastY = dy; ccLastShift = docShiftPx;
      ccShown = true;
      cc.classList.add('show');

      // 動いている間は点灯したまま、止まってから点滅を再開
      cc.classList.remove('blink');
      clearTimeout(ccBlinkTimer);
      ccBlinkTimer = setTimeout(function() { if (ccShown) cc.classList.add('blink'); }, 520);
    }

    ['input', 'keydown', 'keyup', 'click', 'mousedown', 'mouseup', 'select', 'focus', 'blur',
     'compositionupdate', 'compositionend'].forEach(function(ev) {
      edit.addEventListener(ev, scheduleCaret);
    });
    edit.addEventListener('scroll', scheduleCaret, { passive: true });
    document.addEventListener('selectionchange', function() {
      if (document.activeElement === edit) scheduleCaret();
    });
    window.addEventListener('resize', scheduleCaret);
    new MutationObserver(scheduleCaret).observe(edit, { attributes: true, attributeFilter: ['class', 'style'] });
    scheduleCaret();

    initColorSwatches();
    initCustomFonts();
    applySettings();
    restoreFromStorage();
    if (settings.autoSave) pushHistoryEntry();
    updateStats();
    updateTitle();
    
    // Force reset: remove all show classes from dialogs, menus, overlays
    document.querySelectorAll('.overlay, .win-dialog, .menu-dropdown, #tabSwitcher, #contextMenu').forEach(function(el) {
      el.classList.remove('show');
    });
    document.body.classList.remove('popup-open');
    
    edit.focus();
  })();
  </script>
</body>
</html>
